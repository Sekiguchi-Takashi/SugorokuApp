name: Build Human APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-human:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Build Human debug APK
        run: gradle :human:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SugorokuApp-human-apk
          path: human/build/outputs/apk/debug/human-debug.apk
