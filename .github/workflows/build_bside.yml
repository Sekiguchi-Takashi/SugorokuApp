name: Build B-side APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-bside:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build B-side debug APK
        run: gradle :bside:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SugorokuApp-bside-debug-apk
          path: bside/build/outputs/apk/debug/bside-debug.apk
