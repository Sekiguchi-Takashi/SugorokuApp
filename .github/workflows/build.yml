name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  app:
    name: A面 どうぶつすごろく
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SugorokuApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  bside:
    name: B面 がっこうすごろく
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build B-side debug APK
        run: gradle :bside:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SugorokuApp-bside-debug-apk
          path: bside/build/outputs/apk/debug/bside-debug.apk
