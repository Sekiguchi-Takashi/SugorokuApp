name: Build APK

# APKの配布は Release（タグ発行）で行う。
# ここで actions/upload-artifact を使うと Artifacts の無料枠(0.5GB)が枯渇し
# "Artifact storage quota has been hit" でビルドが落ちるので、絶対に足さないこと。
# このワークフローは「コンパイルが通るか」の確認用と割り切る。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  app:
    name: A面 どうぶつすごろく
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

  bside:
    name: B面 がっこうすごろく
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build B-side debug APK
        run: gradle :bside:assembleDebug
